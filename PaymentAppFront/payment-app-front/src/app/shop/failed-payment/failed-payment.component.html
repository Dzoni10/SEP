<div class="container">
  <mat-card class="failed-card">
    
    <div class="icon-wrapper">
      <div class="icon-circle failed">
        <mat-icon>close</mat-icon>
      </div>
    </div>

    <h1>Payment Failed</h1>
    <p>Your payment was not successful. Please try again or use another method.</p>

    <div class="actions">
      <button mat-stroked-button [routerLink]="['/webshop']">
        Back to Home
      </button>
    </div>

  </mat-card>
</div>
